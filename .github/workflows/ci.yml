name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Roll back: a commit whose images exist (default: the selected branch head)"
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and widget checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # moon compares a pull request with its base branch, so it needs the history.
          fetch-depth: 0
      # ... and the base as a local branch, which is how moon names it.
      - if: github.event_name == 'pull_request'
        run: git branch --force "$GITHUB_BASE_REF" "origin/$GITHUB_BASE_REF"
      # Installs node, pnpm, python, uv and moon as pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: moon run frontend:lint frontend:typecheck frontend:test frontend:build
      - run: moon run widgets:lint widgets:typecheck widgets:test widgets:build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: git branch --force "$GITHUB_BASE_REF" "origin/$GITHUB_BASE_REF"
      - uses: jdx/mise-action@v5
      - run: uv sync --locked
      # The database tests need PostgreSQL and the event and queue tests Valkey, set up as
      # in development. Both are required here: with CI set (GitHub sets it), those tests
      # fail instead of skipping when their service is missing.
      - run: docker compose -f docker-compose.infra.yml up -d --wait postgres valkey
      - run: moon run backend:lint backend:format backend:test

  images:
    name: Image ${{ matrix.image }}
    # Only images whose code passed the checks get built and published.
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, gateway]
    steps:
      - uses: actions/checkout@v7

      # ghcr.io/benni-tec/ada/<image>; registry names must be lowercase.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          # latest and sha-<commit> from main; VERSION in .env selects one for Compose.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=pr

      - uses: docker/setup-buildx-action@v4

      # Pull requests only check that the images build; main publishes them.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          # Every image builds from the repo root (and its .dockerignore).
          context: .
          file: services/${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to the Verda VM
    # docs/deploy.md. Only the images job's output is deployed: sha-<commit> of this run.
    needs: [images]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-ada
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      # Secrets are not available to `if`, so the gate is a step.
      - id: gate
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::Deploy skipped: DEPLOY_HOST, DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS is not set."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - if: steps.gate.outputs.run == 'true'
        name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # metadata-action's `type=sha` tag: sha- and the first 7 characters of the commit.
          sha="$(git rev-parse --short=7 HEAD)"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # Runs on the VM as root's login shell would: the token arrives first on stdin, then
          # the compose files as a tar stream. Nothing secret is in the command line.
          remote='
            set -euo pipefail
            sha=$1 actor=$2
            test -f /opt/ada/.env || { echo "/opt/ada/.env is missing (POSTGRES_PASSWORD)" >&2; exit 1; }
            read -r token
            exec 9> /opt/ada.lock
            flock -w 600 9
            cd /opt/ada
            tar -x docker-compose.yml docker-compose.infra.yml docker-compose.deploy.yml
            trap "docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
            printf %s "$token" | docker login ghcr.io -u "$actor" --password-stdin
            export VERSION="sha-$sha"
            compose="docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml"
            $compose pull
            $compose up -d --remove-orphans
            echo "$sha" > REVISION
          '

          # One connection only: a second one right after the first stalls on a fresh VM.
          { printf '%s\n' "$GITHUB_TOKEN"; git archive --format=tar HEAD docker-compose.yml docker-compose.infra.yml docker-compose.deploy.yml; } |
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
              "$DEPLOY_USER@$DEPLOY_HOST" "bash -c $(printf '%q' "$remote") deploy $sha $GITHUB_ACTOR"

          # The gateway sends /api to the backend, so this reaches its liveness route through
          # Caddy, the gateway and the backend. The host is the VM's sslip.io name.
          url=https://ada.65-109-75-63.sslip.io/api/health/live
          for _ in $(seq 18); do
            curl -fsS --max-time 5 "$url" && exit 0
            sleep 5
          done
          echo "::error::$url did not answer within 90 s"
          exit 1
