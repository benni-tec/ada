# Weekly update pull requests. Minor and patch updates are grouped per ecosystem;
# major updates come one per pull request. CI checks and builds every one of them.
#
# Not covered, bump by hand: the tools in mise.toml, plus the pnpm version that also
# appears in package.json and services/frontend/Dockerfile.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  # Base images of our images (python, node, nginx) and the infrastructure images.
  - package-ecosystem: docker
    directories:
      - /services/backend
      - /services/frontend
      - /services/gateway
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
