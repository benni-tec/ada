[project]
name = "ada"
version = "0.1.0"
description = "ADA backend: pipelines of operators over data sources, served over REST and MCP"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "dishka>=1.10.1",
    "duckdb>=2.0.0",
    "fastapi>=0.162.7",
    "fastmcp>=4.2.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-ai-slim[google,openai]>=2.68.0",
    "pydantic-settings>=2.16.3",
    "pytz>=2026.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
ada = "ada.entrypoints.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "taskiq[reload]>=0.13.0",
]

[tool.pytest]
testpaths = ["tests"]
# tach installs a pytest plugin that skips "unaffected" tests on request; we always run all.
addopts = ["-p", "no:tach"]
