# Module boundaries of the hexagonal layout (README: Architecture). `tach check` runs in
# backend:lint, so CI fails on an import that crosses a boundary.
#
# The check is exact: a listed dependency that nothing uses fails too. Ports, adapters,
# the worker and the composition root may all depend on ada.core.models; add it to their
# lists with the first import.

source_roots = ["src"]
exclude = ["tests"]
# ada/__init__.py holds only the package docstring.
root_module = "ignore"

# The core imports nothing outside itself.
[[modules]]
path = "ada.core.models"
depends_on = []

# Outbound ports: what the core needs; implemented by adapters.
[[modules]]
path = "ada.core.ports"
depends_on = ["ada.core.models"]

# Inbound ports: the use cases; called by entrypoints. A use case may take an outbound
# port its caller provides (AgentTurnService.run takes the agent's toolbox).
[[modules]]
path = "ada.core.services.ports"
depends_on = ["ada.core.models", "ada.core.ports"]

[[modules]]
path = "ada.core.services"
depends_on = ["ada.core.models", "ada.core.ports", "ada.core.services.ports"]

[[modules]]
path = "ada.adapters"
depends_on = ["ada.core.ports", "ada.core.models"]

# Entrypoints reach services and adapters only through the container. They may name
# outbound ports too: some are resolved from the container as they are (the event stream,
# the task dispatcher), and their models are in the ports' signatures.
[[modules]]
path = "ada.entrypoints.http"
depends_on = [
    "ada.composition",
    "ada.config",
    "ada.core.models",
    "ada.core.ports",
    "ada.core.services.ports",
    # The MCP app is mounted into the HTTP app.
    "ada.entrypoints.mcp", "ada.discovery", "ada.entrypoints.watch_sources",
]

[[modules]]
path = "ada.entrypoints.mcp"
depends_on = ["ada.core.models", "ada.core.ports", "ada.core.services.ports", "ada.discovery", "ada.entrypoints.watch_sources"]

[[modules]]
path = "ada.entrypoints.worker"
depends_on = [
    "ada.composition",
    "ada.config",
    "ada.core.ports",
    "ada.core.services.ports",
    "ada.discovery",
    # The in-platform agent's tools are the MCP tools, served in process.
    "ada.entrypoints.mcp",
]

[[modules]]
path = "ada.entrypoints.cli"
# migrate runs before any container is usable, so it calls the adapter directly. seed-demo
# reads the example registrations, which are data, from the sources adapter.
depends_on = [
    "ada.adapters",
    "ada.composition",
    "ada.config",
    "ada.core.models",
    "ada.core.ports",
    "ada.core.services.ports",
    "ada.entrypoints.http",
]

# The composition root wires everything together.
[[modules]]
path = "ada.composition"
depends_on = [
    "ada.adapters",
    "ada.config",
    "ada.core.models",
    "ada.core.ports",
    "ada.core.services",
    "ada.core.services.ports", "ada.discovery",
]

[[modules]]
path = "ada.config"
depends_on = []

# Finds the modules of a package, so features register themselves by adding a file.
[[modules]]
path = "ada.discovery"
depends_on = []

[[modules]]
path = "ada.entrypoints.watch_sources"
depends_on = ["ada.core.models", "ada.core.ports", "ada.core.services.ports"]
