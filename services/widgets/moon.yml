# Widgets: each one a self-contained HTML file (dist/<name>.html) that shows the output of
# an operator. The backend serves them as MCP App resources, so the same file renders in our
# frontend and inside an MCP host.
language: "typescript"
layer: "library"
stack: "frontend"
tags: ["react"]

toolchains:
  default: "node"

fileGroups:
  sources:
    - "src/**/*"
  configs:
    - "package.json"
    - "tsconfig*.json"
    - "vite.config.ts"
    - "build.mjs"

tasks:
  dev:
    description: "Serve every widget at http://localhost:5174/<type>.html, with /api forwarded to the backend"
    command: "vite"
    preset: "server"

  build:
    command: "node build.mjs"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
    outputs:
      - "dist"

  typecheck:
    command: "tsc -b"
    inputs:
      - "@group(sources)"
      - "@group(configs)"

  test:
    command: "vitest run"
    inputs:
      - "@group(sources)"
      - "@group(configs)"

  lint:
    command: "oxlint"
    inputs:
      - "@group(sources)"
      - ".oxlintrc.json"
