# Infrastructure: PostgreSQL and Valkey, reachable from the host.
#   moon run root:infra  -> just these, for `moon run :dev` (which starts them itself)
# docker-compose.yml includes this file and adds our services.
name: ada

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ada-dev}
      POSTGRES_DB: ada
    ports:
      # Off the standard ports on the host, so neither clashes with another local instance.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "ada", "-d", "ada"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.3-alpine
    ports:
      - "${VALKEY_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
